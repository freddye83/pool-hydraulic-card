name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  card:
    name: Card checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: node --check dist/pool-hydraulic-card.js
      - name: Version is documented in the changelog
        run: |
          V=$(grep -oP 'PHC_VERSION = "\K[^"]+' dist/pool-hydraulic-card.js)
          echo "Card version: $V"
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::Version $V missing from CHANGELOG.md"; exit 1; }
      - name: Example YAML files parse
        run: |
          pip install pyyaml
          for f in examples/*.yaml; do python -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "OK $f"; done
